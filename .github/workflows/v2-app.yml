name: v2 app (Android + Windows)

on:
  push:
    branches: [v2-rebuild]
    paths:
      - 'v2/app/**'
      - 'v2/assets/**'
      - 'v2/content/**'
      - '.github/workflows/v2-app.yml'
  workflow_dispatch:

concurrency:
  group: v2-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1 # pinned: a new Flutter release must not change a build by surprise
          cache: true
      - name: Sync shared assets
        run: |
          python3 tool/sync_assets.py
          python3 tool/pack_manifest.py app
      - name: Generate platform folder
        run: flutter create --platforms=android --org com.eldawly --project-name classic_control .
      - name: Patch platform folder
        run: python3 tool/patch_platforms.py
      - run: flutter pub get
      - name: Patch plugin build files
        run: python3 tool/patch_pubcache.py
      - name: Analyze (errors become annotations)
        shell: bash
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          cat analyze.txt
          python3 tool/ci_report.py analyze.txt
      - name: Fixed test signing key (updates install over older builds)
        run: mkdir -p ~/.android && cp tool/signing/debug.keystore ~/.android/debug.keystore
      - name: Unit tests (simulation engine + catalog)
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.txt || { python3 tool/ci_report.py test.txt --tail; exit 1; }
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          # retries with back-off: Maven Central / the plugin portal answer 429 now and then
          for i in 1 2 3 4; do
            if flutter build apk --release --build-number ${{ github.run_number }} --dart-define=APP_BUILD=${{ github.run_number }} 2>&1 | tee build.txt; then exit 0; fi
            grep -q "429\|Could not resolve\|Could not GET" build.txt || break
            sleep $((i * 45))
          done
          python3 tool/ci_report.py build.txt --tail; exit 1
      - uses: actions/upload-artifact@v5
        with:
          name: classic-control-android
          path: v2/app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: v2/app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1 # pinned: a new Flutter release must not change a build by surprise
          cache: true
      - name: Sync shared assets
        run: |
          python tool/sync_assets.py
          python tool/pack_manifest.py app
      - name: Generate platform folder
        run: flutter create --platforms=windows --org com.eldawly --project-name classic_control .
      - name: Patch platform folder
        run: python tool/patch_platforms.py
      - run: flutter pub get
      - name: Build Windows
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release --build-number ${{ github.run_number }} --dart-define=APP_BUILD=${{ github.run_number }} 2>&1 | tee build.txt || { python tool/ci_report.py build.txt --tail; exit 1; }
      - name: Bundle the Visual C++ runtime
        # app-local copies so the app starts on PCs without the VC++ Redistributable
        shell: pwsh
        run: |
          $rel = "build/windows/x64/runner/Release"
          foreach ($d in @("msvcp140.dll","msvcp140_1.dll","msvcp140_2.dll","vcruntime140.dll","vcruntime140_1.dll","concrt140.dll")) {
            $src = Join-Path $env:WINDIR "System32\$d"
            if (Test-Path $src) { Copy-Item $src $rel -Force; Write-Host "bundled $d" } else { Write-Host "missing $d" }
          }
          Get-ChildItem $rel | Format-Table Name, Length
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ClassicControl-Windows.zip
      - name: Patch with only the changed files (for the in-app updater)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tool/win_patch.py build/windows/x64/runner/Release --repo ${{ github.repository }} --out .
      - uses: actions/upload-artifact@v5
        with:
          name: classic-control-windows
          path: |
            v2/app/ClassicControl-Windows.zip
            v2/app/ClassicControl-Windows-patch.zip
            v2/app/windows-files.json
            v2/app/windows-patch.json
          retention-days: 30

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # the content files are hashed from the same commit for update.json
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
      - name: Rename
        run: |
          mv dist/classic-control-android/app-release.apk dist/ClassicControl-Android.apk
          mv dist/classic-control-windows/* dist/
      - name: update.json (what the app checks for new builds)
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: >
          python3 v2/app/tool/pack_manifest.py release --build ${{ github.run_number }} --sha ${{ github.sha }}
          --repo ${{ github.repository }} --version "$(sed -n 's/^version: \([0-9.]*\).*/\1/p' v2/app/pubspec.yaml)"
          --dist dist --out dist/update.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2-app-build-${{ github.run_number }}
          name: "نسخة تجريبية ${{ github.run_number }} — معمل الكلاسيك كنترول v2"
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            نسخة تجريبية من فرع v2-rebuild.
            - Android: نزّل ClassicControl-Android.apk وثبّته (اسمح بالتثبيت من مصادر غير معروفة).
            - Windows: فك ضغط ClassicControl-Windows.zip كله في فولدر (مش من جوه ملف الضغط) وشغّل classic_control.exe. مكتبات Visual C++ مضافة جوه الفولدر، ومحتاج Microsoft Edge WebView2 (موجود في ويندوز 10/11).
            - التطبيق نفسه بيلاقي النسخ الجديدة لوحده: على ويندوز بينزّل الملفات اللي اتغيرت بس ويفتح تاني، وعلى أندرويد بينزّل النسخة ويفتح شاشة التثبيت. والدروس والتسجيلات الجديدة بتنزل لوحدها من غير تثبيت.
          files: |
            dist/ClassicControl-Android.apk
            dist/ClassicControl-Windows.zip
            dist/ClassicControl-Windows-patch.zip
            dist/windows-files.json
            dist/update.json
      # the same update.json under a fixed tag: the app reads it with one plain download
      # instead of the releases API (60 calls an hour shared by a whole network)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2-app-latest
          name: "آخر نسخة (للتحديث التلقائي)"
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: ملف يقرأه التطبيق ليعرف آخر نسخة. نزّل التطبيق نفسه من آخر نسخة تجريبية v2-app-build.
          files: dist/update.json
