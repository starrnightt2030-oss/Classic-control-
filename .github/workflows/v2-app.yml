name: v2 app (Android + Windows)

on:
  push:
    branches: [v2-rebuild]
    paths:
      - 'v2/app/**'
      - 'v2/assets/**'
      - 'v2/content/**'
      - '.github/workflows/v2-app.yml'
  workflow_dispatch:

concurrency:
  group: v2-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Sync shared assets
        run: python3 tool/sync_assets.py
      - name: Generate platform folder
        run: flutter create --platforms=android --org com.eldawly --project-name classic_control .
      - name: Patch platform folder
        run: python3 tool/patch_platforms.py
      - run: flutter pub get
      - name: Analyze (errors become annotations)
        shell: bash
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          cat analyze.txt
          python3 tool/ci_report.py analyze.txt
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.txt || { python3 tool/ci_report.py build.txt --tail; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: classic-control-android
          path: v2/app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: v2/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Sync shared assets
        run: python tool/sync_assets.py
      - name: Generate platform folder
        run: flutter create --platforms=windows --org com.eldawly --project-name classic_control .
      - name: Patch platform folder
        run: python tool/patch_platforms.py
      - run: flutter pub get
      - name: Build Windows
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release 2>&1 | tee build.txt || { python tool/ci_report.py build.txt --tail; exit 1; }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ClassicControl-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: classic-control-windows
          path: v2/app/ClassicControl-Windows.zip
          retention-days: 30

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Rename
        run: |
          mv dist/classic-control-android/app-release.apk dist/ClassicControl-Android.apk
          mv dist/classic-control-windows/ClassicControl-Windows.zip dist/ClassicControl-Windows.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2-app-build-${{ github.run_number }}
          name: "نسخة تجريبية ${{ github.run_number }} — معمل الكلاسيك كنترول v2"
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            نسخة تجريبية من فرع v2-rebuild.
            - Android: نزّل ClassicControl-Android.apk وثبّته (اسمح بالتثبيت من مصادر غير معروفة).
            - Windows: فك ضغط ClassicControl-Windows.zip وشغّل classic_control.exe (محتاج Microsoft Edge WebView2، موجود في ويندوز 10/11).
          files: |
            dist/ClassicControl-Android.apk
            dist/ClassicControl-Windows.zip
