name: v2 voice (Gemini TTS)

# Generates the missing narration clips with Gemini TTS, verifies each one against its
# script, and commits them. Needs the repository secret GEMINI_API_KEY.
# Run from Actions → "v2 voice (Gemini TTS)" → Run workflow. Safe to re-run: it continues.

on:
  # editing v2/audio/voice_request.json on v2-rebuild starts a run (no UI needed)
  push:
    branches: [v2-rebuild]
    paths: ['v2/audio/voice_request.json']
  workflow_dispatch:
    inputs:
      voice:
        description: 'Gemini voice name (e.g. Charon, Kore, Puck, Orus, Algieba)'
        default: 'Charon'
      model:
        description: 'TTS model (auto = newest available)'
        default: 'auto'
      max_clips:
        description: 'Max clips this run'
        default: '400'

permissions:
  contents: write

concurrency:
  group: v2-voice
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v2-rebuild
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q faster-whisper numpy
      - name: Generate + verify
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          R=v2/audio/voice_request.json
          get() { python -c "import json;print(json.load(open('$R')).get('$1','$2'))"; }
          python v2/audio/gemini_tts.py --verify --engine "$(get engine gemini)" --voice "$(get voice '')" \
            --model "$(get model auto)" --max "$(get max_clips 400)" --only "$(get only '')" --out "$(get out '')"
      - name: Commit clips
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/assets/audio v2/audio/samples v2/audio/reports/gemini_tts_status.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          n=$(git diff --cached --name-only -- v2/assets/audio | wc -l)
          git commit -m "v2 audio: $n narration clips generated with Gemini TTS (verified)"
          for i in 1 2 3; do git pull --rebase -q origin v2-rebuild && git push -q origin HEAD:v2-rebuild && break; sleep 5; done
