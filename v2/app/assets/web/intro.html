<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>intro</title>
<style>
@font-face{font-family:Cairo;src:url(/assets/fonts/Cairo-400.ttf);font-weight:400}
@font-face{font-family:Cairo;src:url(/assets/fonts/Cairo-700.ttf);font-weight:700}
html,body{margin:0;height:100%;overflow:hidden;background:#05090F;color:#E8EEF2;font-family:Cairo,sans-serif;-webkit-user-select:none;user-select:none}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
video{width:min(100vw,100vh,980px);height:min(100vw,100vh,980px);object-fit:cover;
  -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 52%,transparent 71%);mask-image:radial-gradient(circle at 50% 50%,#000 52%,transparent 71%);
  transition:opacity 1.2s ease, filter 1.2s ease}
.go video{animation:dim 1.4s ease 3.7s forwards}
@keyframes dim{to{opacity:.28;filter:blur(2px) saturate(1.2)}}
#grid{position:absolute;inset:0;background-image:radial-gradient(#13223a 1px,transparent 1px);background-size:22px 22px;opacity:.55}
#glow{position:absolute;left:50%;top:44%;width:70vmin;height:70vmin;transform:translate(-50%,-50%) scale(.4);border-radius:50%;
  background:radial-gradient(circle,rgba(245,164,0,.38),rgba(63,213,232,.12) 45%,transparent 70%);opacity:0}
.go #glow{animation:glow 1.6s cubic-bezier(.2,.8,.2,1) 3.8s forwards}
@keyframes glow{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#logo{position:absolute;left:50%;top:42%;width:min(46vmin,360px);transform:translate(-50%,-50%) scale(.6) rotateX(35deg);opacity:0;filter:drop-shadow(0 18px 40px rgba(0,0,0,.6))}
.go #logo{animation:logo 1.3s cubic-bezier(.16,1.2,.3,1) 3.95s forwards}
@keyframes logo{60%{opacity:1}to{opacity:1;transform:translate(-50%,-50%) scale(1) rotateX(0)}}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,rgba(255,236,190,.85),transparent 55%);opacity:0;pointer-events:none}
.go #flash{animation:flash .9s ease-out 3.95s}
@keyframes flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
#txt{position:absolute;left:0;right:0;top:calc(42% + min(23vmin,180px) + 18px);text-align:center;opacity:0;transform:translateY(14px)}
.go #txt{animation:up .9s ease 4.6s forwards}
@keyframes up{to{opacity:1;transform:none}}
#txt h1{margin:0;font-size:min(6.4vmin,34px);font-weight:700;letter-spacing:.3px}
#txt h2{margin:2px 0 0;font-size:min(3.6vmin,17px);font-weight:400;color:#F5B400;direction:ltr;letter-spacing:2px}
#bolt{display:block;margin:10px auto 0;height:2px;width:0;background:linear-gradient(90deg,transparent,#3FD5E8,#F5A400,#3FD5E8,transparent)}
.go #bolt{animation:line 1s ease 5.0s forwards}
@keyframes line{to{width:min(70vw,420px)}}
#foot{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));text-align:center;font-size:12.5px;color:#93A3AF;opacity:0;line-height:1.7}
#foot b{color:#E8EEF2;font-weight:700}
#foot .org{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
#foot .org img{width:44px;height:44px;border-radius:50%}
#foot .org span{color:#C9D4DB;font-weight:700;font-size:13px}
.go #foot{animation:up .8s ease 5.2s forwards}
</style>
</head>
<body>
<div id="grid"></div>
<div id="stage"><video id="v" src="/assets/intro/intro.mp4" muted playsinline preload="auto"></video></div>
<div id="glow"></div>
<img id="logo" src="/assets/images/logo.webp" alt="Control Academy">
<div id="flash"></div>
<div id="txt"><h1 id="ar"></h1><h2 id="en"></h2><i id="bolt"></i></div>
<div id="foot"></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('ar').textContent = q.get('ar') || 'أكاديمية التحكم الكهربائي';
  document.getElementById('en').textContent = q.get('en') || 'CLASSIC CONTROL LAB';
  const foot = document.getElementById('foot');
  const org = document.createElement('div'); org.className = 'org';
  const ol = document.createElement('img'); ol.src = '/assets/images/org_logo.webp'; ol.alt = '';
  const on = document.createElement('span'); on.textContent = q.get('org') || '';
  org.append(ol, on);
  const b = document.createElement('b'); b.textContent = q.get('dev') || '';
  foot.append(org, b, document.createElement('br'), document.createTextNode(q.get('ver') || ''));
  const bridge = (n, ...a) => { try { const f = window.flutter_inappwebview; if (f && f.callHandler) f.callHandler(n, ...a); } catch (e) {} };
  const v = document.getElementById('v');
  let started = false;
  const go = () => {
    if (started) return; started = true;
    document.body.classList.add('go');
    bridge('started');
    setTimeout(() => bridge('ended'), 7600);
  };
  v.addEventListener('playing', go);
  v.addEventListener('error', go);
  const tryPlay = () => v.play().catch(() => setTimeout(go, 300));
  if (v.readyState >= 2) tryPlay(); else v.addEventListener('canplay', tryPlay, { once: true });
  setTimeout(go, 2500); // never wait forever for the video
</script>
</body>
</html>
