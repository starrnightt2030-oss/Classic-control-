<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D</title>
<style>
@font-face{font-family:Cairo;src:url(/assets/fonts/Cairo-400.ttf);font-weight:400}
@font-face{font-family:Cairo;src:url(/assets/fonts/Cairo-700.ttf);font-weight:700}
html,body{margin:0;height:100%;overflow:hidden;background-color:#081024;background-image:radial-gradient(#1A2A55 1px,transparent 1px),radial-gradient(ellipse at 85% 0%,rgba(61,139,255,.22),transparent 60%);background-size:16px 16px,100% 100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:absolute;inset:0;outline:none}
#lines{position:absolute;inset:0;pointer-events:none;overflow:visible}
#labels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;left:0;top:0;background:rgba(10,18,40,.9);border:1px solid #2B3F73;border-radius:8px;padding:3px 8px 4px 9px;color:#E8EEF2;font:700 12.5px/1.25 Cairo,sans-serif;white-space:nowrap;text-align:right;will-change:transform}
.lbl b{float:right;margin-left:7px;margin-top:1px;min-width:18px;height:18px;border-radius:5px;background:#3D8BFF;color:#FFFFFF;font:700 11px/18px Cairo,sans-serif;text-align:center}
.lbl small{display:block;font:400 10px/1.2 Cairo,sans-serif;color:#93A3AF;direction:ltr;text-align:right}
.lbl.sel{background:#3D8BFF;color:#0A1228;border-color:#3D8BFF}
.lbl.sel b{background:#0A1228;color:#3D8BFF}
.lbl.sel small{color:#4a3500}
.compact .lbl{font-size:10.5px;padding:2px 6px 3px 6px;border-radius:6px}
.compact .lbl b{min-width:15px;height:15px;line-height:15px;font-size:9.5px;margin-left:5px}
.compact .lbl small{font-size:8.5px}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#93A3AF;font:600 14px Cairo,sans-serif;pointer-events:none}
</style>
<script type="importmap">
{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}
</script>
</head>
<body>
<div id="msg">جاري تحميل المجسم…</div>
<svg id="lines"></svg>
<div id="labels"></div>
<script type="module" src="./viewer.js"></script>
</body>
</html>
