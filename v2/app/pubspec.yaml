name: classic_control
description: "Control Academy — أكاديمية التحكم الكهربائي (Classic Control Lab v2)"
publish_to: 'none'
version: 2.3.0+4

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_inappwebview: 6.1.5
  audioplayers: ^6.1.0
  flutter_svg: ^2.0.10
  shared_preferences: ^2.3.0
  animations: '>=2.0.11 <4.0.0'
  pdf: ^3.11.1
  path_provider: ^2.1.4
  share_plus: '>=11.0.0 <14.0.0'
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/models/
    - assets/audio/sfx/
    # >>> audio
    # <<< audio
    - assets/images/
    - assets/images/thumbs/
    - assets/images/cards/
    - assets/panel/
    - assets/diagrams/
    - assets/fonts/
    - assets/web/
    - assets/web/vendor/three/build/
    - assets/web/vendor/three/examples/jsm/loaders/
    - assets/web/vendor/three/examples/jsm/controls/
    - assets/web/vendor/three/examples/jsm/environments/
    - assets/web/vendor/three/examples/jsm/utils/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-400.ttf
          weight: 400
        - asset: assets/fonts/Cairo-600.ttf
          weight: 600
        - asset: assets/fonts/Cairo-700.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700
