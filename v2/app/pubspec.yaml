name: classic_control
description: "معمل الكلاسيك كنترول — Classic Control Simulation Lab (v2)"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_inappwebview: 6.1.5
  audioplayers: ^6.1.0
  flutter_svg: ^2.0.10
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/models/
    - assets/audio/sfx/
    # >>> audio
    # <<< audio
    - assets/images/
    - assets/images/thumbs/
    - assets/diagrams/
    - assets/fonts/
    - assets/web/
    - assets/web/vendor/three/build/
    - assets/web/vendor/three/examples/jsm/loaders/
    - assets/web/vendor/three/examples/jsm/controls/
    - assets/web/vendor/three/examples/jsm/environments/
    - assets/web/vendor/three/examples/jsm/utils/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-400.ttf
          weight: 400
        - asset: assets/fonts/Cairo-600.ttf
          weight: 600
        - asset: assets/fonts/Cairo-700.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700
