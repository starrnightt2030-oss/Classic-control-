<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>عارض المكوّن — موبايل</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3FD5E8}a:hover{color:#8BE6F1}
.ic{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0F12; color: #E8EEF2; font-family: Cairo, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 10px; padding: 16px 14px 8px">
    <a href="Library.dc.html" aria-label="رجوع للمكتبة" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #26323C; background: #131A1F; color: #E8EEF2; display: grid; place-items: center; flex: none">
      <svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <h1 style="margin: 0; font-size: 18px; font-weight: 800; line-height: 1.3">الكونتاكتور</h1>
      <span style="font-size: 11.5px; color: #93A3AF; font-family: 'JetBrains Mono', monospace; direction: ltr; text-align: right">AC Contactor · EC1-D09 · IEC 60947-4-1</span>
    </div>
    <button aria-label="تصدير صورة أو PDF أو فيديو" style="height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid #26323C; background: #131A1F; color: #E8EEF2; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; flex: none">
      <svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4"></path><path d="M5 13v6.5h14V13"></path></svg>
      تصدير
    </button>
  </header>

  <section aria-label="المجسم ثلاثي الأبعاد" style="position: relative; height: 330px; flex: none; margin: 0 10px; border-radius: 22px; background-color: #10161B; background-image: radial-gradient(#1C2730 1px, transparent 1px); background-size: 16px 16px; border: 1px solid #222C35; overflow: hidden">
    <sc-if value="{{ exploded }}" hint-placeholder-val="{{ true }}">
      <div dir="ltr" style="position: absolute; left: 0; top: 34px; width: 368px; height: 237px">
        <img src="/_blob/f64ec538a4328ce299799685d4b88fe2" alt="الكونتاكتور مفكوك" style="width: 100%; height: 100%; object-fit: contain">
        <sc-for list="{{ spots }}" as="s" hint-placeholder-count="8">
          <button aria-label="{{ s.name }}" onClick="{{ s.pick }}" style="{{ s.style }}">{{ s.n }}</button>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ assembled }}" hint-placeholder-val="{{ false }}">
      <img src="/_blob/a482b6234efa90d772a0c5806998a21e" alt="الكونتاكتور مجمّع" style="position: absolute; left: 74px; top: 30px; width: 240px; height: 240px; object-fit: contain">
    </sc-if>

    <div style="position: absolute; top: 10px; right: 10px; left: 10px; display: flex; justify-content: space-between; align-items: center">
      <div role="group" aria-label="وضع العرض" style="display: flex; background: #0B0F12; border: 1px solid #26323C; border-radius: 12px; padding: 3px">
        <button onClick="{{ setAssembled }}" style="{{ segA }}">مُجمّع</button>
        <button onClick="{{ setExploded }}" style="{{ segE }}">مفكوك</button>
      </div>
      <span style="font-size: 11px; color: #93A3AF; background: #0B0F12; border: 1px solid #26323C; border-radius: 999px; padding: 3px 10px">اسحب للدوران · قرّب بإصبعين</span>
    </div>

    <div style="position: absolute; bottom: 10px; right: 10px; left: 10px; display: flex; gap: 8px; justify-content: center">
      <button aria-label="إظهار الأسماء" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #3A4A16; background: #1E1A0E; color: #F5A400; display: grid; place-items: center; padding: 0">
        <svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12.5l9-9h7.5V11l-9 9z"></path><circle cx="15.5" cy="8.5" r="1.5"></circle></svg>
      </button>
      <button aria-label="إعادة ضبط الكاميرا" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #26323C; background: #131A1F; color: #E8EEF2; display: grid; place-items: center; padding: 0">
        <svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"></path><path d="M20 4v5h-5"></path></svg>
      </button>
      <button aria-label="قص الجسم لرؤية الداخل" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #26323C; background: #131A1F; color: #E8EEF2; display: grid; place-items: center; padding: 0">
        <svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"></path><path d="M12 3v18" stroke-dasharray="2 2.5"></path></svg>
      </button>
      <button aria-label="ملء الشاشة" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #26323C; background: #131A1F; color: #E8EEF2; display: grid; place-items: center; padding: 0">
        <svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg>
      </button>
    </div>
  </section>

  <section aria-label="الجزء المختار" style="flex: 1; min-height: 0; margin-top: 12px; background: #131A1F; border-top: 1px solid #26323C; border-radius: 24px 24px 0 0; padding: 10px 18px 18px; display: flex; flex-direction: column; gap: 12px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 99px; background: #33414C"></span>
    <div style="display: flex; align-items: flex-start; gap: 12px">
      <span style="flex: none; width: 34px; height: 34px; border-radius: 10px; background: #F5A400; color: #0B0F12; display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px">{{ cur.n }}</span>
      <div style="flex: 1; min-width: 0">
        <h2 style="margin: 0; font-size: 19px; font-weight: 800; line-height: 1.35">{{ cur.name }}</h2>
        <div style="font-size: 12.5px; color: #93A3AF; direction: ltr; text-align: right">{{ cur.en }}</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; background: #0B0F12; border: 1px solid #26323C; border-radius: 16px; padding: 8px 10px 8px 14px">
      <button aria-label="تشغيل الشرح الصوتي" style="flex: none; width: 48px; height: 48px; border-radius: 50%; border: none; background: #3FD5E8; display: grid; place-items: center; padding: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="transform: scaleX(-1)"><path d="M7 4.5l13 7.5-13 7.5z" fill="#0B0F12"></path></svg>
      </button>
      <div aria-hidden="true" style="flex: 1; height: 30px; display: flex; align-items: center; gap: 3px">
        <sc-for list="{{ wave }}" as="w" hint-placeholder-count="30">
          <span style="{{ w.style }}"></span>
        </sc-for>
      </div>
      <span style="font-size: 11.5px; color: #93A3AF; flex: none">بالمصري</span>
    </div>

    <div role="tablist" aria-label="محتوى الجزء" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: #0B0F12; border-radius: 12px; padding: 4px">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
        <button role="tab" aria-selected="{{ t.sel }}" onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.label }}</button>
      </sc-for>
    </div>
    <p style="margin: 0; font-size: 14.5px; line-height: 1.85; color: #D5DEE4; overflow: hidden">{{ body }}</p>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: 'coil', mode: 'exploded', tab: 0 }; }
  renderVals() {
    const P = [
      { id: 'front_housing', n: 1, x: 10, y: 60, name: 'الغطاء الأمامي وحاضن الترامل', en: 'Front housing & terminal shroud',
        t: ['الغطاء الأمامي بيحضن الترامل ونقط التلامس، وعليه ليبل الكود وشباك المؤشر اللي بيوريك الكونتاكتور شاد ولا فاصل.', 'غطا مشروخ بيكشف أجزاء عليها جهد، والكونتاكتور لازم يتغير أو الغطا يتبدل.', 'بص على الغطا كويس قبل التركيب: مفيش شروخ ولا آثار حرارة حوالين الترامل.'] },
      { id: 'fixed_top', n: 2, x: 27, y: 25, name: 'النقط الثابتة (جهة الدخول)', en: 'Fixed contacts (line side)',
        t: ['دي النقط الثابتة اللي جاية من ترامل الدخول. كل واحدة شريحة نحاس، طرفها الأول متوصل بالترمينال من بره، وفي آخرها حتة فضة هي اللي بتلمس النقطة المتحركة.', 'لو النقط دي اتحرقت أو اتآكلت، الفازة اللي عليها هتوصل للموتور ضعيفة أو مش هتوصل خالص.', 'والكونتاكتور شاد، قيس الجهد بين واحد واتنين، لازم يبقى قريب من الصفر.'] },
      { id: 'moving_contacts', n: 3, x: 29, y: 58, name: 'الكباري المتحركة', en: 'Moving contact bridges',
        t: ['دي الكباري المتحركة، كل كوبري شريحة نحاس على طرفيها نقطتين فضة. لما الكويل يشد، الكوبري ينزل على النقطتين الثابتتين ويوصل الدخول بالخروج.', 'لو السوستة اللي ورا الكوبري ضعفت، التلامس هيبقى خفيف، والنقط هتسخن وتسود بسرعة.', 'بعد الفك، بص على الكوبري: مايل؟ النقط فيها حفر؟ السوستة مكسورة؟'] },
      { id: 'carrier', n: 4, x: 40, y: 52, name: 'حامل النقط المتحرك', en: 'Contact carrier',
        t: ['ده الحامل، قطعة بلاستيك عازل متركب فيها الكباري الأربعة، ومن ورا متشبك في القلب المتحرك، فكل النقط تقفل مع بعض في نفس اللحظة.', 'لو الحامل اتكسر أو علق، النقط ممكن تفضل مقفولة أو متقفلش خالص.', 'والكهربا مفصولة خالص، زق الحامل بإيدك واتأكد إنه بيتحرك بنعومة ويرجع لوحده.'] },
      { id: 'armature', n: 5, x: 54, y: 47, name: 'القلب المتحرك', en: 'Moving armature',
        t: ['ده القلب المتحرك، حديد على شكل حرف E، معمول من رقايق حديد كتير جنب بعض عشان تقلل التيارات الدوامية اللي بتسخن الحديد.', 'لو وش القلب فيه تراب أو صدأ، مش هيقفل كويس، والكونتاكتور هيزن بصوت عالي.', 'امسح وشوش القلب الثابت والمتحرك بقماشة نضيفة، ومتحطش عليهم زيت ولا شحم.'] },
      { id: 'coil', n: 6, x: 64, y: 44, name: 'الكويل (الملف)', en: 'Coil',
        t: ['ده الكويل، ملف سلك نحاس معزول ملفوف لفات كتير على بكرة بلاستيك، وطرفينه طالعين على ترمينال A1 و A2. أول ما توصل عليه الجهد المكتوب على الليبل بيعمل مجال مغناطيسي يشد القلب المتحرك.', 'كويل محروق يعني الكونتاكتور مش بيشد خالص، رغم إن الجهد واصل على A1 و A2.', 'والكهربا مفصولة، قيس بالأفوميتر بين A1 و A2 على الأوم. لو القراية ما لا نهاية يبقى الكويل مقطوع، ولو قريبة من الصفر يبقى فيه قصر.'] },
      { id: 'base', n: 7, x: 79, y: 36, name: 'القاعدة وكلبس الدين ريل', en: 'Base & DIN-rail clip',
        t: ['دي القاعدة اللي شايلة القلب الثابت والكويل، ومن ورا فيها كلبس بيتركب على الدين ريل مقاس 35 مللي: تعلّق الحتة اللي فوق وتضغط لتحت لحد ما تسمع تكة.', 'كونتاكتور مش متثبت كويس بيترعش وهو شغال، وده بيبوظ النقط والترامل.', 'بعد التركيب، حاول تحركه بإيدك، لازم يكون ثابت على الريل.'] },
      { id: 'fixed_bottom', n: 8, x: 30, y: 88, name: 'النقط الثابتة (جهة الخروج)', en: 'Fixed contacts (load side)',
        t: ['دي النقط الثابتة ناحية الخروج، اتنين وأربعة وستة، ومنها الكهربا بتروح للأوفرلود وبعدين للموتور. الكوبري المتحرك بيوصل بين النقطة اللي فوق واللي تحت، وده اسمه فتح مزدوج.', 'فازة واحدة مش واصلة للموتور بتخليه يزن ويسخن ومش يقوم، وده اسمه فقد فازة.', 'والكونتاكتور شاد، قيس الجهد بين التلات فازات عند اتنين وأربعة وستة، لازم يكونوا متساويين.'] }
    ];
    const s = this.state;
    const spots = P.map((p) => {
      const on = p.id === s.sel;
      return {
        n: p.n, name: p.name,
        pick: () => this.setState({ sel: p.id }),
        style: 'position: absolute; left: calc(' + p.x + '% - 14px); top: calc(' + p.y + '% - 14px); width: 28px; height: 28px; border-radius: 50%; padding: 0; font-family: JetBrains Mono, monospace; font-size: 12px; font-weight: 700; display: grid; place-items: center; ' +
          (on ? 'background: #F5A400; color: #0B0F12; border: 2px solid #0B0F12; box-shadow: 0 0 0 4px rgba(245,164,0,.35)' : 'background: #0B0F12; color: #E8EEF2; border: 1.5px solid #3FD5E8')
      };
    });
    const cur = P.find((p) => p.id === s.sel);
    const segOn = 'height: 34px; padding: 0 14px; border-radius: 9px; border: none; background: #F5A400; color: #0B0F12; font-size: 13px; font-weight: 800';
    const segOff = 'height: 34px; padding: 0 14px; border-radius: 9px; border: none; background: transparent; color: #C9D4DB; font-size: 13px; font-weight: 600';
    const labels = ['الشرح', 'العطل الشائع', 'الاختبار'];
    const tabs = labels.map((label, i) => ({
      label, sel: i === s.tab ? 'true' : 'false',
      pick: () => this.setState({ tab: i }),
      style: 'height: 38px; border-radius: 9px; border: none; font-size: 13px; ' + (i === s.tab ? 'background: #26323C; color: #E8EEF2; font-weight: 800' : 'background: transparent; color: #93A3AF; font-weight: 600')
    }));
    const H = [8, 14, 22, 12, 26, 18, 10, 24, 28, 16, 9, 20, 26, 14, 8, 18, 24, 12, 20, 27, 15, 9, 13, 22, 17, 10, 6, 12, 8, 5];
    const wave = H.map((h, i) => ({ style: 'flex: 1; border-radius: 2px; height: ' + h + 'px; background: ' + (i < 11 ? '#3FD5E8' : '#33414C') }));
    return {
      spots, cur, tabs, wave, body: cur.t[s.tab],
      exploded: s.mode === 'exploded', assembled: s.mode !== 'exploded',
      segA: s.mode === 'exploded' ? segOff : segOn, segE: s.mode === 'exploded' ? segOn : segOff,
      setAssembled: () => this.setState({ mode: 'assembled' }),
      setExploded: () => this.setState({ mode: 'exploded' })
    };
  }
}
</script>
</body>
</html>
