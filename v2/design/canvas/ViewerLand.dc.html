<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>فك وتركيب — موبايل عرضي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3FD5E8}a:hover{color:#8BE6F1}
.ic{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
button{font-family:inherit}
</style>
</helmet>
<div dir="rtl" style="width: 844px; height: 390px; box-sizing: border-box; background: #0B0F12; color: #E8EEF2; font-family: Cairo, sans-serif; display: flex; overflow: hidden">

  <aside aria-label="أجزاء الكونتاكتور" style="width: 236px; flex: none; background: #131A1F; border-left: 1px solid #222C35; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px">
      <a href="Library.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #26323C; color: #E8EEF2; display: grid; place-items: center; flex: none">
        <svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
      <div style="min-width: 0">
        <div style="font-size: 16px; font-weight: 800; line-height: 1.3">الكونتاكتور</div>
        <div style="font-size: 11px; color: #93A3AF; font-family: 'JetBrains Mono', monospace; direction: ltr; text-align: right">EC1-D09 · 12 parts</div>
      </div>
    </div>
    <ul style="list-style: none; margin: 0; padding: 4px 8px 8px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; flex: 1">
      <sc-for list="{{ parts }}" as="p" hint-placeholder-count="7">
        <li>
          <button style="{{ p.style }}">
            <span style="{{ p.chip }}">{{ p.n }}</span>
            <span style="display: flex; flex-direction: column; min-width: 0; text-align: right">
              <span style="font-size: 13px; font-weight: 700; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ p.name }}</span>
              <span style="font-size: 10.5px; color: #93A3AF; line-height: 1.3; direction: ltr; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ p.en }}</span>
            </span>
          </button>
        </li>
      </sc-for>
    </ul>
  </aside>

  <section aria-label="المجسم مفكوك" style="flex: 1; position: relative; background-color: #0F1519; background-image: radial-gradient(#1C2730 1px, transparent 1px); background-size: 16px 16px">
    <div dir="ltr" style="position: absolute; inset: 0">
      <img src="/_blob/f64ec538a4328ce299799685d4b88fe2" alt="الكونتاكتور مفكوك لأجزائه" style="position: absolute; left: 30px; top: 18px; width: 520px; height: 334px; object-fit: contain">
      <svg width="608" height="390" viewBox="0 0 608 390" aria-hidden="true" style="position: absolute; left: 0; top: 0">
        <path d="M363 162V62H420" stroke="#F5A400" stroke-width="1.5" fill="none"></path>
        <circle cx="363" cy="162" r="5" fill="#F5A400" stroke="#0B0F12" stroke-width="2"></circle>
        <path d="M313 175V58H280" stroke="#C9D4DB" stroke-width="1.2" fill="none"></path>
        <circle cx="313" cy="175" r="4" fill="#0B0F12" stroke="#3FD5E8" stroke-width="2"></circle>
        <path d="M170 102L130 62H96" stroke="#C9D4DB" stroke-width="1.2" fill="none"></path>
        <circle cx="170" cy="102" r="4" fill="#0B0F12" stroke="#3FD5E8" stroke-width="2"></circle>
        <path d="M182 214L230 290H262" stroke="#C9D4DB" stroke-width="1.2" fill="none"></path>
        <circle cx="182" cy="214" r="4" fill="#0B0F12" stroke="#3FD5E8" stroke-width="2"></circle>
        <path d="M455 140L490 112H520" stroke="#C9D4DB" stroke-width="1.2" fill="none"></path>
        <circle cx="455" cy="140" r="4" fill="#0B0F12" stroke="#3FD5E8" stroke-width="2"></circle>
      </svg>
      <div style="position: absolute; left: 420px; top: 40px; background: #F5A400; color: #0B0F12; border-radius: 8px; padding: 3px 10px; display: flex; flex-direction: column; line-height: 1.25">
        <span dir="rtl" style="font-size: 13px; font-weight: 800">الكويل (الملف)</span>
        <span style="font-size: 10.5px; font-weight: 600">Coil · A1–A2</span>
      </div>
      <div style="position: absolute; right: 328px; top: 40px; background: #0B0F12; border: 1px solid #33414C; border-radius: 8px; padding: 3px 10px; display: flex; flex-direction: column; line-height: 1.25; text-align: right">
        <span dir="rtl" style="font-size: 12.5px; font-weight: 700">القلب المتحرك</span>
        <span style="font-size: 10.5px; color: #93A3AF">Moving armature</span>
      </div>
      <div style="position: absolute; right: 512px; top: 44px; background: #0B0F12; border: 1px solid #33414C; border-radius: 8px; padding: 3px 10px; display: flex; flex-direction: column; line-height: 1.25; text-align: right; white-space: nowrap">
        <span dir="rtl" style="font-size: 12.5px; font-weight: 700">النقط الثابتة</span>
        <span style="font-size: 10.5px; color: #93A3AF">Fixed contacts</span>
      </div>
      <div style="position: absolute; left: 262px; top: 274px; background: #0B0F12; border: 1px solid #33414C; border-radius: 8px; padding: 3px 10px; display: flex; flex-direction: column; line-height: 1.25">
        <span dir="rtl" style="font-size: 12.5px; font-weight: 700">الكباري المتحركة</span>
        <span style="font-size: 10.5px; color: #93A3AF">Moving bridges</span>
      </div>
      <div style="position: absolute; left: 520px; top: 96px; background: #0B0F12; border: 1px solid #33414C; border-radius: 8px; padding: 3px 10px; display: flex; flex-direction: column; line-height: 1.25">
        <span dir="rtl" style="font-size: 12.5px; font-weight: 700">القاعدة</span>
        <span style="font-size: 10.5px; color: #93A3AF">Base</span>
      </div>
    </div>

    <div style="position: absolute; left: 12px; top: 12px; display: flex; flex-direction: column; gap: 8px">
      <button aria-label="تركيب الأجزاء" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #26323C; background: #131A1F; color: #E8EEF2; display: grid; place-items: center; padding: 0">
        <svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="8" height="8" rx="1"></rect><path d="M3 3l4 4M21 3l-4 4M3 21l4-4M21 21l-4-4"></path></svg>
      </button>
      <button aria-label="إظهار الأسماء" aria-pressed="true" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #4A3A10; background: #1E1A0E; color: #F5A400; display: grid; place-items: center; padding: 0">
        <svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12.5l9-9h7.5V11l-9 9z"></path><circle cx="15.5" cy="8.5" r="1.5"></circle></svg>
      </button>
      <button aria-label="تصدير" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #26323C; background: #131A1F; color: #E8EEF2; display: grid; place-items: center; padding: 0">
        <svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4"></path><path d="M5 13v6.5h14V13"></path></svg>
      </button>
    </div>

    <div style="position: absolute; right: 14px; left: 70px; bottom: 12px; height: 56px; border-radius: 16px; background: #131A1F; border: 1px solid #26323C; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 14px">
      <button aria-label="إيقاف مؤقت" style="flex: none; width: 40px; height: 40px; border-radius: 50%; border: none; background: #3FD5E8; display: grid; place-items: center; padding: 0">
        <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z" fill="#0B0F12"></path></svg>
      </button>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px">
        <span style="font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">بيشرح دلوقتي: الكويل — إزاي بيشد القلب المتحرك</span>
        <span style="height: 4px; border-radius: 99px; background: #26323C; display: block; overflow: hidden"><span style="display: block; width: 38%; height: 100%; background: #3FD5E8; margin-right: 0"></span></span>
      </div>
      <button aria-label="الجزء التالي" style="flex: none; width: 44px; height: 44px; border-radius: 12px; border: none; background: transparent; color: #E8EEF2; display: grid; place-items: center; padding: 0">
        <svg class="ic" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    const L = [
      ['الغطاء الأمامي', 'Front housing'],
      ['النقط الثابتة (دخول)', 'Fixed contacts · line'],
      ['الكباري المتحركة', 'Moving bridges'],
      ['حامل النقط', 'Contact carrier'],
      ['القلب المتحرك', 'Moving armature'],
      ['الكويل (الملف)', 'Coil'],
      ['سوستة الإرجاع', 'Return springs'],
      ['القاعدة', 'Base & DIN clip']
    ];
    const parts = L.map(([name, en], i) => {
      const on = i === 5;
      return {
        n: i + 1, name, en,
        style: 'width: 100%; min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 4px 8px; border-radius: 10px; border: none; color: #E8EEF2; text-align: right; ' + (on ? 'background: #2A2210' : 'background: transparent'),
        chip: 'flex: none; width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font-family: JetBrains Mono, monospace; font-size: 11px; font-weight: 700; ' + (on ? 'background: #F5A400; color: #0B0F12' : 'background: #1F2930; color: #C9D4DB')
      };
    });
    return { parts };
  }
}
</script>
</body>
</html>
