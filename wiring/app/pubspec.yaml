name: wiring_academy
description: "أكاديمية التمديدات الكهربية — Electrical Wiring Academy"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter_inappwebview: 6.1.5
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sfx/
    - assets/board/
    - assets/models/
    - assets/renders/
    - assets/fonts/
    - assets/web/
    - assets/web/vendor/three/build/
    - assets/web/vendor/three/examples/jsm/loaders/
    - assets/web/vendor/three/examples/jsm/controls/
    - assets/web/vendor/three/examples/jsm/environments/
    - assets/web/vendor/three/examples/jsm/utils/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-400.ttf
          weight: 400
        - asset: assets/fonts/Cairo-600.ttf
          weight: 600
        - asset: assets/fonts/Cairo-700.ttf
          weight: 700
